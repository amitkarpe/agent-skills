<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-strong: #1d4ed8;
      --navy: #111827;
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-muted: #f8fafc;
      --text: #0a0a0a;
      --muted: #6b6b6b;
      --border: #e8e8ec;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --code-bg: #eef2ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: var(--primary-strong); text-decoration: none; }
    a:hover { color: var(--primary-hover); text-decoration: underline; }
    .hero {
      background: var(--navy);
      color: #fff;
      border-bottom: 4px solid var(--primary);
    }
    .hero-inner, main {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
    }
    .hero-inner { padding: 32px 0 28px; }
    .eyebrow {
      color: #c7d2fe;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1, h2 { margin: 0; line-height: 1.2; }
    h1 { margin-top: 8px; font-size: 30px; }
    .subtitle { max-width: 820px; margin: 12px 0 0; color: #dbeafe; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chip {
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(199, 210, 254, .45);
      border-radius: 6px;
      padding: 4px 10px;
      color: #eef2ff;
      background: rgba(99, 102, 241, .22);
      font-size: 13px;
    }
    main { padding: 24px 0 40px; }
    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: 12px;
      padding: 20px;
    }
    section h2 { font-size: 20px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    th { background: var(--surface-muted); color: var(--muted); font-size: 13px; }
    code {
      background: var(--code-bg);
      border-radius: 4px;
      padding: 2px 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="eyebrow">Agent Web Dashboard</div>
      <h1>{{TITLE}}</h1>
      <p class="subtitle">{{SUMMARY}}</p>
      <div class="chips">
        <span class="chip">lane: {{LANE}}</span>
        <span class="chip">updated: {{UPDATED}}</span>
      </div>
    </div>
  </header>
  <main>
    <section>
      <h2>Reports</h2>
      <table>
        <thead><tr><th>Report</th><th>Updated</th></tr></thead>
        <tbody>
{{REPORT_ROWS}}
        </tbody>
      </table>
      <p class="muted">Static index generated from published lane HTML files.</p>
    </section>
  </main>
</body>
</html>
