interface:
  display_name: "Run Worker Goal"
  short_description: "Dispatch an exact approved goal to a verified worker"
  default_prompt: "Use $run-worker-goal only when execution of one exact approved goal is explicitly requested and its worker thread/workspace mapping is verified. Preserve the selected authority mode, reconcile current goal state and follow native queue. Stop on missing approval, ambiguous mapping or uncertain prior dispatch; never infer a path or target."

policy:
  allow_implicit_invocation: false
