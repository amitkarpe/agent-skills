name: chatgpt-browser-oracle
description: >
  Legacy artifact-only browser workflow requiring explicit task-specific approval.
  Not for GitHub collaboration, repository review, generic Pro requests, or
  ordinary generated-file requests.

triggers:
  - explicitly approved legacy browser artifact workflow

policy:
  allow_implicit_invocation: false

instructions: |
  Read SKILL.md and the owning repository authority first. Require explicit
  approval for this browser task and owner-supplied profile, project, endpoint
  and output locations. Inspect existing script defaults before use; do not
  assume they match the approved target. GitHub collaboration must use its
  repository-owned protocol, not this browser path. No service or credential
  changes are authorized by invoking this skill.

scripts:
  - path: scripts/chatgpt_focus_control_tab.sh
    purpose: Focus Oracle Chrome and select control tab 1
  - path: scripts/chatgpt_ensure_model.js
    purpose: Inspect or select Instant, Thinking, or Pro and save model proof
  - path: scripts/chatgpt_submit_project_prompt.js
    purpose: Submit a prompt file into the configured ChatGPT project
  - path: scripts/chatgpt_download_latest_file.js
    purpose: Download the newest matching generated file and copy it to durable paths
  - path: scripts/validate_generated_file.sh
    purpose: Validate common generated file formats locally
  - path: scripts/oracle_run_browser.sh
    purpose: Run the Oracle CLI in browser mode for text-first jobs
